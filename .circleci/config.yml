# CircleCI 2.1 pipeline for Artemis City.
# See: https://circleci.com/docs/reference/configuration-reference
#
# This mirrors the GitHub Actions `ci.yml` job: install deps, validate the
# environment configs, and run the Python test suite under src/tests.
version: 2.1

# Reusable execution environment.
executors:
  py:
    docker:
      # Pin a concrete Python minor version that matches our support matrix.
      # See: https://circleci.com/developer/images/image/cimg/python
      - image: cimg/python:3.12
    working_directory: ~/project

commands:
  restore_pip_cache:
    steps:
      - restore_cache:
          keys:
            - pip-v2-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - pip-v2-{{ checksum "requirements.txt" }}
            - pip-v2-

  save_pip_cache:
    steps:
      - save_cache:
          key: pip-v2-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip

jobs:
  build-and-test:
    executor: py
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Default the loader to the dev environment for the config-validation step.
      ARTEMIS_ENV: dev
    steps:
      - checkout
      - restore_pip_cache
      - run:
          name: Install dependencies
          command: |
            python -m pip install --upgrade pip setuptools wheel
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
            # Belt-and-suspenders for the config-validation and test steps.
            pip install pyyaml pytest
      - save_pip_cache
      - run:
          name: Validate environment configs
          command: |
            python - <<'PY'
            from src.utils.environments import load_environment, VALID_ENVIRONMENTS
            for env in VALID_ENVIRONMENTS:
                cfg = load_environment(env)
                assert cfg["name"] == env, (env, cfg)
                assert cfg["deploy"]["branch"] == env, (env, cfg)
            print("env configs OK")
            PY
      - run:
          name: Run tests
          command: python -m pytest src/tests -q

# Orchestrate jobs using workflows.
# See: https://circleci.com/docs/reference/configuration-reference/#workflows
workflows:
  ci:
    jobs:
      - build-and-test
