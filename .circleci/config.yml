version: 2.1

# =============================================================================
# Artemis City — primary CI/CD pipeline
# -----------------------------------------------------------------------------
# CircleCI is the PRIMARY CI/CD system for this repo. GitHub Actions retains
# only the promotion cascade (.github/workflows/promote.yml), which advances
# the dev -> staging -> prod branch pointers; every branch advance then runs
# through the branch-filtered workflows below.
#
# Environment model (authoritative: docs/ENVIRONMENTS.md):
#
#   Branch     GitHub Env   Approvals   Deploy
#   --------   ----------   ---------   --------------------------------------
#   dev        dev          0           auto on every green build
#   staging    staging      1           manual approval gate, then deploy
#   prod       prod         2           manual approval gate, then deploy
#
# Note: prod is the DEFAULT branch — there is no `main`.
#
# Staging/prod deploys trigger when their env branch moves — either by a
# direct push or via the GitHub promote.yml cascade fast-forwarding it.
#
# Stage 1 (checks) runs in parallel on every branch:
#   docs-mirror · python-checks (single Python 3.12) · typescript-api · secrets-check
# Stage 2 (deploy) is branch-gated and, for staging/prod, approval-gated.
# =============================================================================

# -----------------------------------------------------------------------------
# COMMANDS (reusable step sequences)
# -----------------------------------------------------------------------------

commands:
  install_uv:
    steps:
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"

  restore_uv_cache:
    steps:
      - restore_cache:
          keys:
            - uv-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
            - uv-v1-{{ checksum "requirements.txt" }}
            - uv-v1-

  save_uv_cache:
    steps:
      - save_cache:
          key: uv-v1-{{ checksum "requirements.txt" }}-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/uv

  restore_npm_cache:
    steps:
      - restore_cache:
          keys:
            - npm-root-v1-{{ checksum "package-lock.json" }}
            - npm-root-v1-

  save_npm_cache:
    steps:
      - save_cache:
          key: npm-root-v1-{{ checksum "package-lock.json" }}
          paths:
            - ~/.npm

# -----------------------------------------------------------------------------
# JOBS
# -----------------------------------------------------------------------------
jobs:

  # ── Docs mirror gate ───────────────────────────────────────────────────────
  # CLAUDE.md and AGENTS.md must stay byte-for-byte identical (repo rule).
  docs-mirror:
    docker:
      - image: cimg/base:current
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: CLAUDE.md and AGENTS.md must be byte-for-byte mirrors
          command: |
            if ! diff -q CLAUDE.md AGENTS.md >/dev/null; then
              echo "ERROR: CLAUDE.md and AGENTS.md have drifted — edit both in the same commit." >&2
              diff CLAUDE.md AGENTS.md || true
              exit 1
            fi
            echo "CLAUDE.md and AGENTS.md are in sync."

  # ── Python checks (single supported interpreter version) ───────────────────
  python-checks:
    docker:
      # Pin the supported minor line while still receiving 3.12.x patch updates.
      - image: cimg/python:3.12
    working_directory: ~/project
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      # Neutral CI value so the env loader never accidentally pulls a real env's config.
      ARTEMIS_ENV: dev
    steps:
      - checkout
      - install_uv
      - restore_uv_cache
      - run:
          name: Install dependencies
          command: |
            uv venv --python 3.12 .venv
            uv pip install --python .venv/bin/python -r requirements.txt -r requirements-dev.txt
            # Belt-and-suspenders for the checks below; advisory linters are not
            # declared in requirements-dev so install them here.
            uv pip install --python .venv/bin/python pyyaml pytest pytest-cov black isort flake8 bandit
      - save_uv_cache
      - run:
          name: Validate environment configs (dev / staging / prod)
          command: |
            .venv/bin/python - <<'PY'
            from src.utils.environments import load_environment, VALID_ENVIRONMENTS
            for env in VALID_ENVIRONMENTS:
                cfg = load_environment(env)
                assert cfg["name"] == env, (env, cfg)
                assert cfg["deploy"]["branch"] == env, (env, cfg)
            print("env configs OK:", VALID_ENVIRONMENTS)
            PY
      - run:
          name: Reject undefined Python names
          command: .venv/bin/ruff check src app/api/main.py --select F821
      - run:
          name: Run pytest with coverage
          command: |
            mkdir -p test-results
            .venv/bin/python -m pytest src/tests \
              --cov \
              --cov-report=xml:test-results/coverage.xml \
              --cov-report=term-missing \
              --junitxml=test-results/junit.xml \
              -q
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results
          destination: test-results
      # Advisory linters are non-blocking.
      # Remove the `|| true` on any one to make it a hard gate.
      - run:
          name: "Advisory: Black format check"
          command: .venv/bin/black --check . || true
      - run:
          name: "Advisory: isort import order"
          command: .venv/bin/isort --check-only . || true
      - run:
          name: "Advisory: Flake8 lint"
          command: .venv/bin/flake8 . || true
      - run:
          name: "Advisory: Bandit security scan"
          command: .venv/bin/bandit -r src app -f json -o test-results/bandit.json || true
      - store_artifacts:
          path: test-results/bandit.json
          destination: bandit.json

  # ── TypeScript: root Express API ───────────────────────────────────────────
  typescript-api:
    docker:
      - image: cimg/node:24.0
    working_directory: ~/project
    steps:
      - checkout
      - restore_npm_cache
      - run:
          name: Install deps (skip lifecycle scripts)
          # Root package.json lifecycle hooks can call hatch/docker, which are
          # not available in CI — --ignore-scripts keeps the install hermetic.
          command: npm ci --ignore-scripts
      - save_npm_cache
      - run:
          name: Type check (tsc --noEmit)
          command: npm run typecheck
      - run:
          name: Jest tests
          command: npm test
      - run:
          name: Dependency vulnerability gate
          command: npm audit --audit-level=high
      - run:
          name: "Advisory: ESLint"
          command: npm run lint || true

  # ── Secrets scan (uses the repo's detect-secrets baseline) ─────────────────
  secrets-check:
    docker:
      # Pin the supported minor line while still receiving 3.12.x patch updates.
      - image: cimg/python:3.12
    working_directory: ~/project
    steps:
      - checkout
      - install_uv
      - run:
          name: detect-secrets (diff against .secrets.baseline)
          command: |
            uv venv --python 3.12 .venv
            uv pip install --python .venv/bin/python "detect-secrets==1.4.0"
            # Same check the pre-commit hook runs: fail if a tracked file
            # introduces a secret not already audited in the baseline.
            git ls-files -z | xargs -0 .venv/bin/detect-secrets-hook --baseline .secrets.baseline

  # ── Deploy (parameterized; placeholder — wire your provider in below) ───────
  deploy:
    parameters:
      env:
        type: string
    docker:
      # Pin the supported minor line while still receiving 3.12.x patch updates.
      - image: cimg/python:3.12
    working_directory: ~/project
    environment:
      ARTEMIS_ENV: << parameters.env >>
    steps:
      - checkout
      - install_uv
      - run:
          name: Load environment config (<< parameters.env >>)
          command: |
            uv venv --python 3.12 .venv
            uv pip install --python .venv/bin/python pyyaml
            .venv/bin/python - <<'PY'
            import os, json
            from src.utils.environments import load_environment
            cfg = load_environment(os.environ["ARTEMIS_ENV"])
            print(json.dumps(cfg, indent=2))
            PY
      - run:
          name: Build artifacts (placeholder)
          command: |
            echo "Build step for << parameters.env >> — wire your container build or package step here."
      - run:
          name: Deploy to << parameters.env >> (placeholder)
          no_output_timeout: 20m
          command: |
            echo "Deploying to << parameters.env >> — replace with your provider's deploy command."
            # Examples (uncomment + add the matching context/secret):
            #   flyctl deploy --config fly.<< parameters.env >>.toml
            #   heroku container:push web --app artemis-city-<< parameters.env >> && \
            #     heroku container:release web --app artemis-city-<< parameters.env >>
            #   python scripts/deploy.py --env << parameters.env >>

# -----------------------------------------------------------------------------
# WORKFLOWS
# -----------------------------------------------------------------------------
workflows:

  # ── dev: checks → auto-deploy dev ──────────────────────────────────────────
  # (Promotion to staging/prod stays on GitHub promote.yml.)
  dev-pipeline:
    jobs:
      - docs-mirror:
          filters: { branches: { only: dev } }
      - python-checks:
          name: python-3.12
          filters: { branches: { only: dev } }
      - typescript-api:
          filters: { branches: { only: dev } }
      - secrets-check:
          filters: { branches: { only: dev } }

      # Auto-deploy dev on green (0 approvals).
      - deploy:
          name: deploy-dev
          env: dev
          # To scope secrets, create the context and uncomment:
          # context: [artemis-dev]
          requires: &checks
            - docs-mirror
            - python-3.12
            - typescript-api
            - secrets-check
          filters: { branches: { only: dev } }

  # ── staging: branch advance (push or promote.yml) → checks → 1 approval → deploy ─
  staging-pipeline:
    jobs:
      - docs-mirror:
          filters: { branches: { only: staging } }
      - python-checks:
          name: python-3.12
          filters: { branches: { only: staging } }
      - typescript-api:
          filters: { branches: { only: staging } }
      - secrets-check:
          filters: { branches: { only: staging } }
      - hold-staging:
          type: approval
          requires: *checks
          filters: { branches: { only: staging } }
      - deploy:
          name: deploy-staging
          env: staging
          # context: [artemis-staging]
          requires: [hold-staging]
          filters: { branches: { only: staging } }

  # ── prod: branch advance (push or promote.yml) → checks → approval → deploy ─
  # prod requires 2 approvals per docs/ENVIRONMENTS.md. CircleCI's built-in
  # approval is a single hold; enforce 2 DISTINCT reviewers with a restricted
  # context on deploy-prod (see docs/CICD.md → "Two-reviewer prod gate").
  prod-pipeline:
    jobs:
      - docs-mirror:
          filters: { branches: { only: prod } }
      - python-checks:
          name: python-3.12
          filters: { branches: { only: prod } }
      - typescript-api:
          filters: { branches: { only: prod } }
      - secrets-check:
          filters: { branches: { only: prod } }
      - hold-prod:
          type: approval
          requires: *checks
          filters: { branches: { only: prod } }
      - deploy:
          name: deploy-prod
          env: prod
          # context: [artemis-prod]   # make this a RESTRICTED context for the 2-reviewer gate
          requires: [hold-prod]
          filters: { branches: { only: prod } }

  # ── feature / PR branches: checks only, no deploy ──────────────────────────
  pr-checks:
    jobs:
      - docs-mirror:
          filters: { branches: { ignore: [dev, staging, prod] } }
      - python-checks:
          name: python-3.12
          filters: { branches: { ignore: [dev, staging, prod] } }
      - typescript-api:
          filters: { branches: { ignore: [dev, staging, prod] } }
      - secrets-check:
          filters: { branches: { ignore: [dev, staging, prod] } }
