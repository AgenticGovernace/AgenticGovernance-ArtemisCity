version: 2.1

orbs:
  python: circleci/python@2

jobs:
  # ============================================================
  # PYTHON CHECKS
  # ============================================================
  python-checks:
    # pyproject requires-python is ">=3.11,<3.14"; 3.12 is the primary runtime.
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: requirements.txt
      - run:
          name: Install dev + test tools
          command: |
            if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
            pip install pyyaml pytest pytest-cov black isort flake8 mypy bandit
      - run:
          name: Validate environment configs (dev/staging/prod)
          command: |
            python - <<'PY'
            from src.utils.environments import load_environment, VALID_ENVIRONMENTS
            for env in VALID_ENVIRONMENTS:
                cfg = load_environment(env)
                assert cfg["name"] == env, (env, cfg)
                assert cfg["deploy"]["branch"] == env
            print("env configs OK")
            PY
      - run:
          name: Run tests (pytest; testpaths=src/tests from pyproject)
          command: pytest --cov=src --cov-report=xml
      # --- Advisory style/lint/security (non-blocking) ---
      - run:
          name: "Advisory: Black format check"
          command: black --check . || true
      - run:
          name: "Advisory: isort import order"
          command: isort --check-only . || true
      - run:
          name: "Advisory: Flake8"
          command: flake8 . || true
      - run:
          name: "Advisory: MyPy"
          command: mypy src || true
      - run:
          name: "Advisory: Bandit"
          command: bandit -r src app || true

  # ============================================================
  # TYPESCRIPT — root Express API (app/api)
  # ============================================================
  typescript-api:
    # Root package.json declares engines.node >=24.
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install deps (skip lifecycle scripts)
          # The root package.json has preinstall/prepare/install hooks that call
          # hatch and docker, which aren't available (and shouldn't run) in CI.
          command: npm ci --ignore-scripts
      - run:
          name: Type check (tsc --noEmit)
          command: npm run typecheck
      - run:
          name: Lint (advisory)
          command: npm run lint || true

  # ============================================================
  # TYPESCRIPT — Obsidian MCP server (src/Artemis Agentic Memory Layer)
  # ============================================================
  typescript-memory-layer:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout
      - run:
          name: Install deps
          command: cd "src/Artemis Agentic Memory Layer" && npm ci
      - run:
          name: Lint (advisory)
          command: cd "src/Artemis Agentic Memory Layer" && npm run lint || true
      - run:
          name: Build (tsc)
          command: cd "src/Artemis Agentic Memory Layer" && npm run build

  # ============================================================
  # SECRET SCAN
  # ============================================================
  secrets-check:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Check for hardcoded secrets
          command: |
            FOUND=0
            for pattern in "API_KEY=.[a-zA-Z0-9]" "PASSWORD=.[a-zA-Z0-9]" "SECRET=.[a-zA-Z0-9]"; do
              if grep -rn --include="*.py" --include="*.ts" --include="*.js" --include="*.yml" --include="*.yaml" --include="*.md" \
                -E "$pattern" . \
                --exclude-dir=.git --exclude-dir=node_modules --exclude="*.example" \
                | grep -v "placeholder" | grep -v "your_" | grep -v "<" | grep -v "must be set" | grep -v "ENV_VAR" | grep -v "=xxx"; then
                FOUND=1
              fi
            done
            if [ "$FOUND" -eq 1 ]; then
              echo "WARNING: Potential hardcoded secrets detected. Review the matches above."
              exit 1
            fi
            echo "No hardcoded secrets detected."

workflows:
  ci:
    jobs:
      - python-checks
      - typescript-api
      - typescript-memory-layer
      - secrets-check
