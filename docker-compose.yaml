version: '3.8'

services:
  # Core Artemis Services
  kernel:
    build:
      context: .
      dockerfile: Dockerfile
      target: kernel
    ports:
      - "8000:8000"
    environment:
      - ARTEMIS_ENV=production
      - ARTEMIS_LOG_LEVEL=INFO
      - ARTEMIS_REGISTRY_URL=http://registry:8002
      - ARTEMIS_MEMORY_BUS_URL=http://memory-bus:8001
      - ARTEMIS_REDIS_URL=redis://redis:6379
    depends_on:
      - registry
      - memory-bus
      - redis
    volumes:
      - ./vault:/data/vault
      - ./data/checkpoints:/data/checkpoints
      - ./logs:/var/log/artemis
    networks:
      - artemis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  memory-bus:
    build:
      context: .
      dockerfile: Dockerfile
      target: memory-bus
    ports:
      - "8001:8001"
    environment:
      - ARTEMIS_ENV=production
      - ARTEMIS_OBSIDIAN_VAULT_PATH=/data/vault
      - ARTEMIS_VECTOR_STORE_URL=http://vector-store:6333
      - ARTEMIS_REDIS_URL=redis://redis:6379
      - ARTEMIS_MEMORY_WRITE_TIMEOUT_MS=200
      - ARTEMIS_MEMORY_SYNC_TIMEOUT_MS=300
    depends_on:
      - vector-store
      - redis
    volumes:
      - ./vault:/data/vault
    networks:
      - artemis
    restart: unless-stopped

  registry:
    build:
      context: .
      dockerfile: Dockerfile
      target: registry
    ports:
      - "8002:8002"
    environment:
      - ARTEMIS_ENV=production
      - ARTEMIS_REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - artemis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infrastructure Services
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - artemis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}

  vector-store:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - vector-data:/qdrant/storage
    networks:
      - artemis
    restart: unless-stopped
    environment:
      - QDRANT_API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY must be set}

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - artemis
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - artemis
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  vector-data:
  prometheus-data:
  grafana-data:

networks:
  artemis:
    driver: bridge
