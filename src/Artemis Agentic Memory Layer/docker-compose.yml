services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      MCP_API_KEY: ${MCP_API_KEY}
      OBSIDIAN_BASE_URL: ${OBSIDIAN_BASE_URL:-https://127.0.0.1:27123}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      DEBUG: ${DEBUG:-*}
    networks:
      - mcp_network

networks:
  mcp_network:
    driver: bridge