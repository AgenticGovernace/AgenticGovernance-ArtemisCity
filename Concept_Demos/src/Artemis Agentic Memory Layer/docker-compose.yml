version: '3.8'

services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MCP_API_KEY: ${MCP_API_KEY}
      OBSIDIAN_BASE_URL: ${OBSIDIAN_BASE_URL:-https://host.docker.internal:27124}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
    networks:
      - mcp_network

networks:
  mcp_network:
