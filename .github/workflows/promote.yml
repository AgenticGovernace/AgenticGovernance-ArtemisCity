name: Promote

on:
  workflow_dispatch:
    inputs:
      from:
        description: Source environment branch
        required: true
        type: choice
        options: [development, staging, prod]
      to:
        description: Target environment branch
        required: true
        type: choice
        options: [development, staging, prod]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: promote-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  open-promotion-pr:
    runs-on: github-actions
    strategy:
      fail-fast: false
      matrix:
        from: [development, staging, prod]
        to: [development, staging, prod]
    steps:
      - name: Validate direction
        run: |  
          from="${{ github.event.inputs.from }}"
          to="${{ github.event.inputs.to }}"
          case "${from}->${to}" in
            "dev->staging"|"staging->prod"|"dev->prod") ;;
            *) echo "Invalid promotion ${from} -> ${to}" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PR
        env: 
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
        run: |
  
          gh pr create --base "$TO" --head "$FROM" --title "$title" --body "$body" --draft
