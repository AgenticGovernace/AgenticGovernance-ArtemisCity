name: Promote

on:
  push:
    branches: [dev]
  # Manual re-run of the cascade from the Actions tab. Regardless of which ref
  # the UI selects, the cascade always promotes the current `dev` tip (resolved
  # in the `resolve` job below) — never the default branch or an arbitrary ref.
  workflow_dispatch: {}

# contents: write is required to advance the staging/prod branch pointers.
permissions:
  contents: write

concurrency:
  group: promote-${{ github.ref }}
  # Never cancel a promotion mid-flight: a cancelled run could leave staging
  # fast-forwarded but prod not, splitting the environments. Let an in-progress
  # cascade finish; a newer dev commit promotes on the next run.
  cancel-in-progress: false

jobs:
  # Resolve the exact commit to promote ONCE, so the gate tests and the branch
  # pushes all refer to the same SHA.
  #  - push:             the commit that was pushed to dev (== github.sha).
  #  - workflow_dispatch: the current tip of origin/dev (github.sha would be the
  #                       tip of whatever ref the UI selected, which defaults to
  #                       the default branch — promoting that would be wrong).
  resolve:
    name: Resolve dev commit
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            sha="${{ github.sha }}"
          else
            git fetch origin dev
            sha="$(git rev-parse FETCH_HEAD)"
          fi
          echo "Promoting dev commit: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # --- CI gate: mirrors the CircleCI required checks (docs-mirror + tests) so a
  # docs-mirror or test failure cannot slip a commit through to staging/prod.
  # This is defense-in-depth on the GitHub side; CircleCI runs the fuller check
  # set (lint, typescript-api, secrets-check) on the dev branch before promotion
  # is triggered. ---

  docs-mirror:
    name: Docs mirror gate
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - name: CLAUDE.md and AGENTS.md must stay byte-for-byte mirrors
        run: |
          if ! diff -q CLAUDE.md AGENTS.md >/dev/null; then
            echo "::error::CLAUDE.md and AGENTS.md have drifted — they must be byte-for-byte identical." >&2
            diff CLAUDE.md AGENTS.md || true
            exit 1
          fi
          echo "CLAUDE.md and AGENTS.md are in sync."

  test:
    name: Test gate
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # Pin the supported minor line while still receiving 3.12.x patch updates.
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install deps
        run: make install-dev
      - name: Validate environment configs
        run: |
          .venv/bin/python - <<'PY'
          from src.utils.environments import load_environment, VALID_ENVIRONMENTS
          for env in VALID_ENVIRONMENTS:
              cfg = load_environment(env)
              assert cfg["name"] == env, (env, cfg)
              assert cfg["deploy"]["branch"] == env, (env, cfg)
          print("env configs OK")
          PY
      - name: Reject undefined Python names
        # Jupyter/IDE virtual-document snapshots are not application source;
        # some are plain Python exports with an .ipynb suffix and cannot be
        # parsed as notebooks by Ruff.
        run: make lint
      - name: Run tests
        run: make test
      - name: Build documentation
        run: make docs

  # --- Security gate: the same `make security` developers run locally.
  # Three layers, all of which fail closed on ANY finding:
  #   security-static — bandit over src/ and app/ with the reviewed policy in
  #                     pyproject.toml [tool.bandit] (suppressions are inline,
  #                     justified `# nosec` annotations, not silent skips).
  #   security-deps   — pip-audit over the exact uv.lock resolution.
  #   security-node   — npm audit over every lockfile in the repo
  #                     (src, src/launch, src/Artemis Agentic Memory Layer,
  #                     app/api, app/web/frontend), --audit-level=low.
  # npm comes from the runner image; lockfileVersion 3 needs npm >= 7, which
  # every supported ubuntu-22.04 image ships.
  security:
    name: Security gate
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - name: Install deps
        run: make install-dev
      - name: Run security gates
        run: make security

  # The cascade deliberately never uses --force, so it can only advance a
  # branch that is still an ancestor of the promoted commit. If someone merges
  # a PR straight into staging or prod, that branch diverges and every later
  # run dies at a `git push` with a bare "non-fast-forward" rejection.
  #
  # Checking lineage up front turns that into an actionable error AND keeps the
  # environments together: without this gate, staging fast-forwards and prod
  # then rejects, leaving the two environments split on different commits.
  branch-lineage:
    name: Branch lineage gate
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: staging and prod must be ancestors of the promoted commit
        env:
          # Passed through env rather than interpolated into the script body.
          PROMOTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -u
          diverged=0
          for branch in staging prod; do
            # Resolve the tip with ls-remote rather than a remote-tracking ref.
            # actions/checkout narrows remote.origin.fetch to the checked-out
            # ref, so refs/remotes/origin/<branch> may be absent or stale here;
            # reading a stale ref would make this gate silently pass.
            tip="$(git ls-remote origin "refs/heads/${branch}" | cut -f1)"
            if [ -z "$tip" ]; then
              echo "origin/${branch} does not exist yet; nothing to promote over."
              continue
            fi
            # Make sure the objects behind that tip are present locally so
            # merge-base can reason about them.
            git fetch --quiet origin "refs/heads/${branch}" || true
            if git merge-base --is-ancestor "$tip" "$PROMOTED_SHA"; then
              echo "origin/${branch} at ${tip} is an ancestor of ${PROMOTED_SHA} - fast-forward is possible."
            else
              behind="$(git rev-list --count "${PROMOTED_SHA}..${tip}")"
              echo "::error::origin/${branch} has diverged from the cascade: it holds ${behind} commit(s) that are not in the promoted commit ${PROMOTED_SHA}, so a fast-forward push is impossible. This usually means a pull request was merged directly into ${branch} instead of into dev. Reconcile ${branch} with dev (merge it back, or realign the branch onto the tested commit) before promoting again."
              git log --oneline "${PROMOTED_SHA}..${tip}" | head -20
              diverged=1
            fi
          done
          exit "$diverged"

  promote-staging:
    name: Promote dev -> staging
    needs: [resolve, docs-mirror, test, security, branch-lineage]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Check out the exact tested commit so it is present locally to push.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward staging to the tested commit
        run: |
          # No --force: a non-fast-forward push fails loudly, which is the right
          # signal that someone diverged staging outside the cascade.
          git push origin "HEAD:refs/heads/staging"
          
  promote-prod:
    name: Promote staging -> prod
    needs: [resolve, promote-staging]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # staging now points at this commit (set by promote-staging) and
          # nothing between here moves it, so promoting the same tested commit
          # to prod keeps the dev -> staging -> prod history strictly linear.
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Fast-forward prod to the promoted staging commit
        run: |
          git push origin "HEAD:refs/heads/prod"
