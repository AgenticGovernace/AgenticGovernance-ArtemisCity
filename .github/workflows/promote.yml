name: Promote

# Automated promotion cascade: a push to `dev` flows all the way to `prod`
# without anyone touching the staging/prod branches by hand.
#
#   push dev --> test --> ff staging --> deploy staging --> ff prod --> deploy prod
#
# Promotion advances the environment branches with a plain `git push` of the
# tested commit. There is no promotion *pull request*, so `dev` is never
# consumed as a PR head branch and is never auto-deleted — the source of the
# old "I have to recreate dev after every promotion" pain.
#
# Per-environment approval gates are preserved by the `environment:` binding on
# the deploy jobs (in deploy.yml): if the `staging` / `prod` GitHub Environments
# have required reviewers, those deploys pause for approval before running.

on:
  push:
    branches: [dev]
  # Manual re-run of the cascade from the Actions tab (promotes current dev tip).
  workflow_dispatch: {}

# contents: write is required to advance the staging/prod branch pointers.
permissions:
  contents: write

concurrency:
  group: promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pyyaml pytest
      - name: Validate environment configs
        run: |
          python - <<'PY'
          from src.utils.environments import load_environment, VALID_ENVIRONMENTS
          for env in VALID_ENVIRONMENTS:
              cfg = load_environment(env)
              assert cfg["name"] == env, (env, cfg)
              assert cfg["deploy"]["branch"] == env, (env, cfg)
          print("env configs OK")
          PY
      - name: Run tests
        run: python -m pytest src/tests

  promote-staging:
    name: Promote dev -> staging
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward staging to the tested dev commit
        env:
          SHA: ${{ github.sha }}
        run: |
          # Advance (or create) staging to point at the tested commit. No
          # --force: a non-fast-forward push fails loudly, which is the right
          # signal that someone diverged staging outside the cascade.
          git push origin "${SHA}:refs/heads/staging"

  deploy-staging:
    name: Deploy staging
    needs: promote-staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  promote-prod:
    name: Promote staging -> prod
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward prod to the deployed staging commit
        env:
          SHA: ${{ github.sha }}
        run: |
          # staging now points at ${SHA} (set by promote-staging) and nothing
          # between here moves it, so promoting the same commit to prod keeps
          # the dev -> staging -> prod history strictly linear.
          git push origin "${SHA}:refs/heads/prod"

  deploy-prod:
    name: Deploy prod
    needs: promote-prod
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
    secrets: inherit
