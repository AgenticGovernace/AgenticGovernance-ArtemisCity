name: CI

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CLAUDE.md and AGENTS.md must stay byte-for-byte mirrors
        run: |
          if ! diff -q CLAUDE.md AGENTS.md >/dev/null; then
            echo "::error::CLAUDE.md and AGENTS.md have drifted — they must be byte-for-byte identical. Edit both in the same commit." >&2
            diff CLAUDE.md AGENTS.md || true
            exit 1
          fi
          echo "CLAUDE.md and AGENTS.md are in sync."

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pyyaml
      - name: Validate environment configs
        run: |
          python - <<'PY'
          from src.utils.environments import load_environment, VALID_ENVIRONMENTS
          for env in VALID_ENVIRONMENTS:
              cfg = load_environment(env)
              assert cfg["name"] == env, (env, cfg)
              assert cfg["deploy"]["branch"] == env
          print("env configs OK")
          PY
      - name: Run tests
        run: |
          python -m pytest src/tests
