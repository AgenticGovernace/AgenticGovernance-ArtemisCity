name: Dependency Submission

on:
  push:
    branches: [dev, staging, prod]
  pull_request:
    branches: [dev, staging, prod]
  workflow_dispatch:

permissions:
  contents: write   # required to write the dependency graph snapshot

jobs:
  submit-deps:
    runs-on: ubuntu-latest
    # Best-effort: dependency-graph submission must never block the pipeline.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Submit dependency graph
        uses: actions/dependency-submission-action@v4
        with:
          manifest-path: src/pyproject.toml
          ecosystem: python
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
