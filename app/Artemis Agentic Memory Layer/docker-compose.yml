services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:3000"
    environment:
      PORT: 3000
      # The server binds ARTEMIS_MTLS_HOST, which defaults to loopback so a
      # direct local run is not exposed on every interface. Inside a container
      # loopback is unreachable from the published port above, so bind all
      # interfaces here; the container boundary provides the isolation instead.
      ARTEMIS_MTLS_HOST: ${ARTEMIS_MTLS_HOST:-0.0.0.0}
      # Default to production; override via .env for local dev work.
      NODE_ENV: ${NODE_ENV:-production}
      # Fail fast if these secrets are not provided (matches the pattern
      # used elsewhere in this repo for REDIS_PASSWORD / GRAFANA_PASSWORD).
      MCP_API_KEY: ${MCP_API_KEY:?MCP_API_KEY must be set}
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY:?OBSIDIAN_API_KEY must be set}
      # host.docker.internal resolves to the Docker host on Mac/Windows.
      # Linux users should override via .env with their host IP, or run
      # the service with `network_mode: host`.
      OBSIDIAN_BASE_URL: ${OBSIDIAN_BASE_URL:-https://host.docker.internal:27123}
      MCP_LOG_LEVEL: ${MCP_LOG_LEVEL:-info}
      # Empty by default in production; set DEBUG=* in your .env for verbose dev logs.
      DEBUG: ${DEBUG:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mcp_network
    # Uncomment on Linux hosts if you need to reach an Obsidian instance
    # running on the host machine and host.docker.internal is unavailable.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

networks:
  mcp_network:
    driver: bridge
