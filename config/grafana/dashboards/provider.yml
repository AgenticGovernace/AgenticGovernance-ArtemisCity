# Grafana dashboard provisioning for the Artemis City compose stack.
apiVersion: 1

providers:
  - name: artemis-dashboards
    orgId: 1
    folder: Artemis City
    type: file
    disableDeletion: true
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
