# Prometheus configuration for the Artemis City compose stack.
# Mounted by docker-compose.yaml into the `prometheus` service at
# /etc/prometheus/prometheus.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Governance, ATP, and memory-bus metrics from the Python kernel
  # (FastAPI /metrics, unauthenticated like /health).
  - job_name: artemis-kernel
    metrics_path: /metrics
    static_configs:
      - targets: ["kernel:8000"]

  # Redis health and performance via the redis-exporter sidecar.
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Prometheus self-monitoring.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
