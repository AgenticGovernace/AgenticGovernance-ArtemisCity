[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis-kernel-mcp"
version = "0.1.0"
description = "MCP adapter for the Artemis City Kernel task surface."
requires-python = ">=3.12,<3.13"
dependencies = [
    "artemis-city==1.0.0",
    "artemis-mcp-common==0.1.0",
    "mcp[cli]==2.0.0",
    "posthog>=7.21",
    "pydantic==2.14.0b1",
]

[project.scripts]
artemis-kernel-mcp = "artemis_kernel_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artemis_kernel_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
artemis-city = { path = "../../..", editable = true }
artemis-mcp-common = { path = "../common", editable = true }
