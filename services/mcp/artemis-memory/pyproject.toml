[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis-memory-mcp"
version = "0.1.0"
description = "Governed MCP adapter over the canonical Artemis City memory service."
requires-python = ">=3.12,<3.13"
dependencies = [
    "artemis-city==1.0.0",
    "artemis-mcp-common==0.1.0",
    "mcp[cli]==2.0.0",
    "posthog>=7.21",
    "pydantic==2.14.0b1",
    "psycopg2-binary>=2.9",
    "beartype==0.23.0rc0",
    "pydantic-core==2.48.0",
    "hf-xet==1.6.1a0",
    "cyclopts==5.0.0b1",
    "protobuf==7.36.0rc2",
]

[project.scripts]
artemis-memory-mcp = "artemis_memory_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/artemis_memory_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
artemis-city = { path = "../../..", editable = true }
artemis-mcp-common = { path = "../common", editable = true }
