# ============================================
# ARTEMIS CITY - PRE-COMMIT HOOKS
# ============================================
# Configuration for pre-commit Git hooks
# Install: pre-commit install --install-hooks
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

# Global configuration


# Stop on first failure
fail_fast: true

# ============================================
# REPOSITORY HOOKS
# ============================================

repos:
  # ==========================================
  # GENERAL FILE CHECKS
  # ==========================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # File checks
      - id: check-added-large-files
        args: [ "--maxkb=1000" ]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: '\.min\.(js|css)$'
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: mixed-line-ending
        args: [ --fix=lf ]

      # Syntax checks
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: check-json
      - id: check-toml
      - id: check-xml

      # Merge conflict markers
      - id: check-merge-conflict

      # Private key detection
      - id: detect-private-key

      # Python specific
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: name-tests-test
        args: [ --pytest-test-first ]

      # Branch protection
      - id: no-commit-to-branch
        # prod/staging are advanced only by the Promote cascade (git push from
        # CI), never by hand. Feature work and direct commits land on dev.
        args: [ --branch, prod, --branch, staging ]

  # ==========================================
  # SECRET DETECTION
  # ==========================================

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [ "--baseline", ".secrets.baseline" ]
        exclude: |
          (?x)^(
            \.env\.example|
            \.env\.template|
            package-lock\.json|
            uv\.lock|
            .*\.canvas$|
            SECURITY\.md$|
            docs/.*\.md$|
            Agents_MD/.*
          )$

  # ============================================
  # PYTHON FORMATTING
  # ============================================

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black
        language_version: python3
        args: [ --line-length=88 ]

  - repo: https://github.com/pycqa/isort
    rev: 9.0.0b5
    hooks:
      - id: isort
        args: [ --profile=black, --line-length=88 ]

  # ==========================================
  # PYTHON LINTING
  # ==========================================

  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # ==========================================
  # PYTHON SECURITY
  # ==========================================

  # Kept in lockstep with the `security-static` target in the root Makefile and
  # with SCANNED_PATHS in src/tests/test_security_policy.py, which asserts all
  # three agree. Three details are load-bearing:
  #
  #  - `rev` ALONE selects the bandit version, and must track the bandit the
  #    rest of the toolchain runs. pre-commit builds this hook its own isolated
  #    venv from the checked-out repo, so a stale rev silently enforces a
  #    different rule set — and a different exclusion matcher — than
  #    `make security-static` does against the same tree.
  #    Do NOT add a version to `bandit[toml]` below. pre-commit's clone is
  #    shallow and carries no tags, so setuptools_scm builds it as 0.0.0;
  #    `bandit[toml]==<rev>` then conflicts with that local build and the hook
  #    fails to install at all ("Cannot install bandit 0.0.0 and bandit==...").
  #    The extra resolves against the local build, so unpinned is correct here.
  #  - `pass_filenames: false` because the roots below are the whole reviewed
  #    surface. Left at the default, pre-commit appends the staged filenames to
  #    argv and bandit scans them IN ADDITION to the roots, dragging in
  #    gitignored vendored files the moment one is staged.
  #  - Roots are named explicitly, never `-r .`, which walks the ~113k vendored
  #    .py files under services/ that .gitignore excludes and bandit — which
  #    reads the filesystem, not git — does not.
  #
  # `exclude` no longer filters what is scanned (pass_filenames is off); it now
  # only decides whether the hook fires at all, skipping the scan when the only
  # staged Python is test code that the bandit policy excludes anyway.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ -c, pyproject.toml, -r, src, app, services/mcp ]
        additional_dependencies: [ "bandit[toml]" ]
        pass_filenames: false
        exclude: ^(tests/|src/tests/)

  # ==========================================
  # TYPE CHECKING
  # ==========================================

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        args: [ --config-file=pyproject.toml ]
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - typing_extensions>=4.0.0
        exclude: |
          (?x)^(
            tests/|
            MCP/tests/|
            \.venv/|
            docs/
          )$

  # ==========================================
  # DOCSTRING COVERAGE (JSF AV Rules 134-135)
  # ==========================================

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [ -v, --fail-under=80, --ignore-init-method, --ignore-init-module ]
        exclude: |
          (?x)^(
            tests/|
            MCP/tests/|
            \.venv/|
            docs/
          )$

  # ==========================================
  # JAVASCRIPT/TYPESCRIPT FORMATTING
  # ==========================================

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [ javascript, jsx, ts, tsx, json, yaml, markdown ]
        exclude: |
          (?x)^(
            package-lock\.json|
            node_modules/
          )$

  # ==========================================
  # YAML LINTING
  # ==========================================

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [ -d, relaxed ]

  # ==========================================
  # MARKDOWN LINTING
  # ==========================================

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: [ --fix ]
        exclude: |
          (?x)^(
            node_modules/|
            \.github/
          )$

  # ==========================================
  # COMMIT MESSAGE
  # ==========================================

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [ commit-msg ]

  # ============================================
  # LOCAL HOOKS
  # ============================================

  - repo: local
    hooks:
      # Repair only deterministic, tracked policy sources. This hook never
      # reads or writes .env files and never generates credentials.
      - id: environment-contract-fix
        name: Repair environment policy contract
        entry: .venv/bin/python scripts/environment_config.py fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

      # Verify configured endpoints immediately before code leaves the local
      # checkout. Root .env remains the local source; this hook is read-only.
      - id: environment-live-check
        name: Check live environment dependencies
        entry: .venv/bin/python scripts/environment_config.py live
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-push ]

      # Custom secret check
      - id: check-secrets-custom
        name: Check for secrets (custom patterns)
        entry: >
          bash -c 'if git diff --cached --name-only -z | xargs -0 -r grep -lE "API_KEY|SECRET|PASSWORD" 2>/dev/null; then echo "WARNING: Potential secrets detected!"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true

      # Ensure .env files are not committed
      - id: prevent-env-commit
        name: Prevent .env files from being committed
        entry: >
          bash -c 'git diff --cached --name-only | grep -E "\\.env$|\\.env\\..*" | grep -v "\\.env\\.example" | grep -v "\\.env\\.template" && echo "ERROR: .env files should not be committed!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true

ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
  skip: [ environment-live-check ]
