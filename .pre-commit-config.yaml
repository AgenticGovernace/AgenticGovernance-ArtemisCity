# ============================================
# ARTEMIS CITY - PRE-COMMIT HOOKS
# ============================================
# Configuration for pre-commit Git hooks
# Install: pre-commit install --install-hooks
# Run manually: pre-commit run --all-files
# Update hooks: pre-commit autoupdate

# Global configuration
default_language_version:
  python: python3.11

# Stop on first failure
fail_fast: true

# ============================================
# REPOSITORY HOOKS
# ============================================

repos:
  # ==========================================
  # GENERAL FILE CHECKS
  # ==========================================

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # File checks
      - id: check-added-large-files
        args: [ "--maxkb=1000" ]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude: '\.min\.(js|css)$'
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: mixed-line-ending
        args: [ --fix=lf ]

      # Syntax checks
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: check-json
      - id: check-toml
      - id: check-xml

      # Merge conflict markers
      - id: check-merge-conflict

      # Private key detection
      - id: detect-private-key

      # Python specific
      - id: check-ast
      - id: check-builtin-literals
      - id: check-docstring-first
      - id: debug-statements
      - id: fix-byte-order-marker
      - id: name-tests-test
        args: [ --pytest-test-first ]

      # Branch protection
      - id: no-commit-to-branch
        # prod/staging are advanced only by the Promote cascade (git push from
        # CI), never by hand. Feature work and direct commits land on dev.
        args: [ --branch, prod, --branch, staging ]

  # ==========================================
  # SECRET DETECTION
  # ==========================================

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [ "--baseline", ".secrets.baseline" ]
        exclude: |
          (?x)^(
            \.env\.example|
            \.env\.template|
            package-lock\.json|
            uv\.lock|
            .*\.canvas$|
            SECURITY\.md$|
            docs/.*\.md$|
            Agents_MD/.*
          )$

  # ============================================
  # PYTHON FORMATTING
  # ============================================

  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        args: [ --line-length=100 ]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [ --profile=black, --line-length=100 ]

  # ==========================================
  # PYTHON LINTING
  # ==========================================

  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-docstrings
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-simplify

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.14
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # ==========================================
  # PYTHON SECURITY
  # ==========================================

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.7
    hooks:
      - id: bandit
        args: [ -c, pyproject.toml, -r, . ]
        additional_dependencies: [ "bandit[toml]" ]
        exclude: ^tests/

  # ==========================================
  # TYPE CHECKING
  # ==========================================

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [ --config-file=pyproject.toml ]
        additional_dependencies:
          - types-PyYAML
          - types-requests
          - typing_extensions>=4.0.0
        exclude: |
          (?x)^(
            tests/|
            MCP/tests/|
            \.venv/|
            docs/
          )$

  # ==========================================
  # DOCSTRING COVERAGE (JSF AV Rules 134-135)
  # ==========================================

  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [ -v, --fail-under=80, --ignore-init-method, --ignore-init-module ]
        exclude: |
          (?x)^(
            tests/|
            MCP/tests/|
            \.venv/|
            docs/
          )$

  # ==========================================
  # JAVASCRIPT/TYPESCRIPT FORMATTING
  # ==========================================

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ javascript, jsx, ts, tsx, json, yaml, markdown ]
        exclude: |
          (?x)^(
            package-lock\.json|
            node_modules/
          )$

  # ==========================================
  # YAML LINTING
  # ==========================================

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [ -d, relaxed ]

  # ==========================================
  # MARKDOWN LINTING
  # ==========================================

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: [ --fix ]
        exclude: |
          (?x)^(
            node_modules/|
            \.github/
          )$

  # ==========================================
  # COMMIT MESSAGE
  # ==========================================

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.13.0
    hooks:
      - id: commitizen
        stages: [ commit-msg ]

  # ============================================
  # LOCAL HOOKS
  # ============================================

  - repo: local
    hooks:
      # Custom secret check
      - id: check-secrets-custom
        name: Check for secrets (custom patterns)
        entry: >
          bash -c 'git diff --cached --name-only | xargs -I {} grep -l "API_KEY\\|SECRET\\|PASSWORD" {} 2>/dev/null && echo "WARNING: Potential secrets detected!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # Ensure .env files are not committed
      - id: prevent-env-commit
        name: Prevent .env files from being committed
        entry: >
          bash -c 'git diff --cached --name-only | grep -E "\\.env$|\\.env\\..*" | grep -v "\\.env\\.example" | grep -v "\\.env\\.template" && echo "ERROR: .env files should not be committed!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true

      # ==========================================
      # JSF COMPLIANCE - COMPLEXITY (AV Rules 1-3)
      # ==========================================

      # Check cyclomatic complexity (max 20 per JSF AV Rule 3)
      - id: radon-complexity
        name: Check cyclomatic complexity (JSF AV Rule 3)
        entry: >
          bash -c 'radon cc app MCP/src --min D --show-complexity 2>/dev/null | grep -v "^$" && echo "ERROR: Functions with complexity D or higher (>20) found!" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

      # Check function length (informational - JSF AV Rule 1)
      - id: check-function-length
        name: Check function length (JSF AV Rule 1 - informational)
        entry: >
          bash -c 'radon raw app MCP/src --summary 2>/dev/null | tail -5'
        language: system
        pass_filenames: false
        always_run: true
        stages: [ manual ]
        verbose: true

ci:
  autofix_commit_msg: "style: auto-fix by pre-commit hooks"
  autofix_prs: true
  autoupdate_commit_msg: "chore: update pre-commit hooks"
  autoupdate_schedule: weekly
  skip: [ ]
