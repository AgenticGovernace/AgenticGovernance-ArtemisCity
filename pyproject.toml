[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "artemis-city"
version = "1.1.0"
description = "Governed multi-agent orchestration with trust-aware routing and Obsidian-backed memory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [
    { name = "Prinston Palmer", email = "prinstonpalmer879@gmail.com" },
]
keywords = [
    "agents",
    "agentic",
    "governance",
    "memory",
    "orchestration",
    "trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "alembic>=1.7.0",
    "anthropic>=0.1.0",
    "click>=8.1.0",
