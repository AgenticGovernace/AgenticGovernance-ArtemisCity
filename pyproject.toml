[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "artemis-city"
version = "0.7.0"
description = "Governed multi-agent orchestration with trust-aware routing and Obsidian-backed memory."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Prinston Palmer", email = "prinstonpalmer879@gmail.com" },
]
keywords = [
    "agents",
    "agentic",
    "governance",
    "memory",
    "orchestration",
    "trust",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "aiohttp>=3.9.0",
    "click>=8.1.0",
    "fastmcp>=3.4.0",
    "httpx>=0.23.0",
    "mcp>=1.26.0",
    "prometheus-client>=0.14.0",
    "pydantic>=2.4.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.1,<7.0.0",
    "requests>=2.33.0",
    "rich>=13.7.0",
    "sqlalchemy>=1.4.0",

]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.109.1",
    "python-multipart>=0.0.27",
    "uvicorn[standard]>=0.15.0",
]
data = [
    "datasets>=2.18.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pyarrow>=23.0.1",
    "scikit-learn>=1.4.0",
]
db = [
    "alembic>=1.7.0",
    "psycopg2-binary>=2.9.0",
    "redis>=4.0.0",
]
dev = [
    "ipdb>=0.13.13",
    "ipython>=8.18.0",
    "pdbpp>=0.10.3",
    "pre-commit>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
lint = [
    "autopep8>=1.5.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "ruff>=0.8.0",
    "safety>=2.3.0",
    "types-pyyaml>=6.0.0",
]
test = [
    "coverage>=7.0.0",
    "coverage-badge>=1.0.0",
    "faker>=18.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.16.0",
    "pytest-cases>=3.7.0",
    "pytest-cov>=3.0.0",
    "pytest-factoryboy>=2.0.0",
    "pytest-fixture-config>=1.0.0",
    "pytest-html>=3.2.0",
    "pytest-mock>=3.7.0",
    "pytest-xdist>=3.0.0",
    "responses>=0.22.0",
]
build = [
    "build>=1.0.0",
    "hatchling>=1.21.0",
    "twine>=3.0.0",
    "wheel>=0.38.1",
]

[project.urls]
GitHub = "https://github.com/AgenticGovernace/AgenticGovernance-ArtemisCity.git"
Documentation = "https://artemiscity.mintlify.app/"
Website = "https://artemiscity.com/"
Demo = "https://artemiscity.com/demos"

[tool.hatch.build]
exclude = [
    "/src/.env.example",
    "/src/Dockerfile*",
    "/src/Artemis Agentic Memory Layer",
    "/src/Experiments",
    "/src/Kernel",
    "/src/launch",
    "/src/tests",
    "/src/uv.lock",
    "/src/*.toml",
    "/src/**/*.ipynb",
    "/src/**/*.md",
    "/src/**/qodana.yaml",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src",
    "app/__init__.py",
    "app/kernel",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "app/__init__.py",
    "app/kernel",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

# Consumed by `bandit -c pyproject.toml` (Makefile `security` target and the
# pre-commit bandit hook). Without this table those invocations run with no
# project configuration.
[tool.bandit]
exclude_dirs = [
    "src/tests",
    ".venv",
    "app/web/frontend",
    "Concept_Demos",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
