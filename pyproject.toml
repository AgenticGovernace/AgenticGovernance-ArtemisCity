[project.urls]
GitHub = "https://github.com/AgenticGovernace/AgenticGovernance-ArtemisCity.git"
Documentation = "https://artemiscity.mintlify.app/"
Website = "https://artemiscity.com/"
Demo = "https://artemiscity.com/demos"

[tool.hatch.build]
exclude = [
    "/src/.env.example",
    "/src/Dockerfile*",
    "/src/Artemis Agentic Memory Layer",
    "/src/Experiments",
    "/src/Kernel",
    "/src/launch",
    "/src/tests",
    "/src/uv.lock",
    "/src/*.toml",
    "/src/**/*.ipynb",
    "/src/**/*.md",
    "/src/**/qodana.yaml",
]

[tool.hatch.build.targets.wheel]
only-include = [
    "src",
    "app/__init__.py",
    "app/kernel",
]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "app/__init__.py",
    "app/kernel",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true

# Consumed by `bandit -c pyproject.toml` (Makefile `security` target and the
# pre-commit bandit hook). Without this table those invocations run with no
# project configuration.
[tool.bandit]
exclude_dirs = [
    "src/tests",
    ".venv",
    "app/web/frontend",
    "Concept_Demos",
]

[tool.coverage.run]
# Keep local and CI reports aligned with every shipped Python runtime plus the
# active FastAPI dashboard. Directory sources are intentional: app/api is a
# deployable namespace directory rather than an import package.
source = ["src", "app/kernel", "app/api"]
omit = [
    "src/tests/*",
    # Demonstration programs are exercised as smoke workflows, not as part of
    # the production-library coverage denominator (docs/TEST_PLAN.md).
    "*/demo_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
