    "src.integration.hebbian_sync",
    "src.integration.memory_bus",
    "src.integration.memory_decay",
    "src.integration.postal_service",
    "src.integration.sql_memory_store",
    "src.main",
    "src.mcp.hebbian_weights",
    "src.mcp.orchestrator",
    "src.mcp.supabase_vector_store",
    "src.obsidian_integration.parser",
    "src.parser",
    "src.run_logger",
    "src.tests.run_simulation",
    "src.tests.test_auth_contracts",
    "src.tests.test_base_agent_compliance",
    "src.tests.test_cli_entrypoints",
    "src.tests.test_dashboard_api",
    "src.tests.test_environments",
    "src.tests.test_instruction_coverage",
    "src.tests.test_kernel_memory_bus",
    "src.tests.test_legal_summarization_coverage",
    "src.tests.test_llm_agent_coverage",
    "src.tests.test_memory_bus",
    "src.tests.test_memory_projections",
    "src.tests.test_orchestrator_coverage",
    "src.tests.test_postal_service",
    "src.tests.test_postgres_memory_ledger",
    "src.tests.test_release_artifacts",
    "src.tests.test_repository_boundaries",
    "src.tests.test_reverse_sync_cleanup",
    "src.tests.test_root_test_retention",
    "src.tests.test_routing_authorization",
    "src.tests.test_routing_contracts",
    "src.tests.test_routing_eligibility",
    "src.tests.test_sql_memory_store",
    "src.utils.run_logger",
    "src.vector_store",
    "services.mcp.artemis-memory.src.artemis_memory_mcp.wiring",
    "services.mcp.artemis-validation.src.artemis_validation_mcp.wiring",
    "artemis_memory_mcp.wiring",
]
ignore_errors = true

[tool.isort]
# Mirrors the pre-commit hook args (--profile=black --line-length=88) so the
# hook and a bare `isort .` agree.
profile = "black"
line_length = 88
# This repository contains src/mcp/, which shadows the external `mcp` SDK.
# Without an explicit classification isort treats the SDK import as first-party
# from some working directories and third-party from others, so the MCP
# adapters are rewritten on every run and the hook never converges.
known_third_party = ["mcp", "posthog"]
# Honour the magic trailing comma exactly as black and ruff do. Without
# this isort collapses an exploded import that ruff then re-explodes, and
# the two hooks rewrite each other on every pre-commit run forever.
split_on_trailing_comma = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
addopts = '-ra --ignore="src/tests/integration/test_artemis_persona 2.py"'

[tool.bandit]
# Scope: the runtime attack surface. Every excluded path has a reason:
 #src/tests: pytest assert idiom and fixtures, not runtime code.
#  - services/mcp/*/tests: same pytest assert idiom, for the MCP server
#    paths, so a mid-path wildcard without it matches nothing and silently
#    scans the tests anyway.
#    packages. The glob needs the trailing "/*" — bandit fnmatches file
#  - src/Kernel: quarantined legacy mirror, frozen by the reverse-sync
#    removal hold (docs/audits/2026-08-16-reverse-sync-72cf776-removal-hold.yaml);
#    byte-locked to app/kernel by test_repository_boundaries.
#    outputs, not shipped runtime behavior.
#  - The two " 2.py" files are held evidence paths (classification
#    REMOVE_REVERSE_SYNC); the hold forbids content rewrite, so they cannot
#    carry inline annotations.
#  - Local virtual environments, package trees, and the archived app/web/api
#    checkout are not reviewed first-party runtime source. Bandit walks the
#    filesystem rather than honoring .gitignore, so these exclusions are
 # src/Experiments: archived experiment material and captured eval run
#    required even though none of those paths can be committed accidentally.
exclude_dirs = [
    "src/tests",
    "services/mcp/*/tests/*",
    "src/Kernel",
    "src/Experiments",
    "src/agents/artemis/persona 2.py",
    "src/agents/research_agent 2.py",
    "*/.venv/*",
    "*/node_modules/*",
    "*/.pixi/*",
    "*/site-packages/*",
    "app/web/api/*",
]
# B112 (try/except/continue): the only remaining site is
# app/kernel/memory_bus.py:149, which is byte-locked to the audit-held
# src/Kernel mirror and cannot take an inline annotation without breaking
# the quarantine byte-identity contract. Re-enable once the hold is released.
skips = [""]

test = [
    "pytest==9.0.3",
    "coverage>=7.0.0",
    "coverage-badge>=1.0.0",
    "faker>=18.0.0",
    "packaging>=24.0",
    "pytest>=9.0.3,<9.1",
    "pytest-asyncio>=0.16.0",
    "pytest-cases>=3.7.0",
    "pytest-cov>=3.0.0",
    "pytest-factoryboy>=2.0.0",
    "pytest-fixture-config>=1.0.0",
    "pytest-mock>=3.7.0",
    "pytest-html>=3.2.0",
    "pytest-xdist>=3.0.0",
    "responses>=0.22.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.5.0"
]

[dependency-groups]
dev = [
    "docker>=7.2.0",
]
