    "email-validator==2.3.0",
    "fastapi>=0.109.1",
    "fastmcp>=0.1.0",
    "httpx>=0.23.0",
    "huggingface-hub>=1.26.1",
    "mcp[cli]>=1.29.0",
    "numpy>=1.24.0",
    "openai>=0.1.0",
    "pandas>=1.5.0",
    "pathvalidate==3.3.1",
    "prometheus-client>=0.14.0",
    "prompt-toolkit>=3.0.0",
    "psycopg2-binary>=2.9.0",
    "py-key-value-shared==0.3.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "pydocket==0.23.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.27",
    "pyyaml>=6.0.1",
    "redis>=4.0.0",
    "requests>=2.33.0",
    "rich>=13.7.0",
    "sqlalchemy>=1.4.0",
    "tensor>=0.0.0",
    "torch>=1.0.0",
    "uvicorn[standard]>=0.15.0",
    "ipdb>=0.13.13",
    "ipython>=8.18.0",
    "pdbpp>=0.10.3",
    "pre-commit>=3.5.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=0.7.0",
    "mkdocstrings[python]>=0.24.0",
    "autopep8>=1.5.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
