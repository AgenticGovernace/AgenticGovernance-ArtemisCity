[project.optional-dependencies]
# Aggregate extra so `install-dev` has a single name for "everything a
# contributor needs"; the Makefile's --all-extras resolves the rest.
dev = ["artemis-city[docs,lint,test,build]"]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocs-mermaid2-plugin>=0.7.0",
    "mkdocstrings[python]>=0.24.0",
]
lint = [
    "autopep8>=1.5.0",
    "bandit>=1.7.0",
    "black>=24.0.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "ruff>=0.8.0",
    "safety>=2.3.0",
    "types-pyyaml>=6.0.0",
]
test = [
    "coverage>=7.0.0",
    "coverage-badge>=1.0.0",
    "faker>=18.0.0",
    "packaging>=24.0",
    "pytest>=9.0.3,<9.1",
    "pytest-asyncio>=0.16.0",
    "pytest-cases>=3.7.0",
    "pytest-cov>=3.0.0",
    "pytest-factoryboy>=2.0.0",
    "pytest-fixture-config>=1.0.0",
    "pytest-html>=3.2.0",
    "pytest-mock>=3.7.0",
    "pytest-xdist>=3.0.0",
    "responses>=0.22.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.5.0",
]
build = [
    "build>=1.0.0",
    "hatchling>=1.21.0",
    "twine>=3.0.0",
    "wheel>=0.38.1"
]

[tool.poetry]
package-mode = false

[tool.hatch.build.targets.wheel]
only-include = ["src", "app"]
# Belongs to the wheel target, not pytest — `exclude` is not a pytest ini
# option, and test_hatch_configuration_remains_unchanged asserts it here.
exclude = ["/app/api/**", "/app/scripts/**", "/app/web/**"]


[tool.mypy]
# mypy previously aborted on a duplicate-module error before checking
# anything, so it has never actually run over this tree. These overrides
# freeze the backlog it exposed: every new and untouched module is fully
# checked, and these are burned down individually. Only remove entries.

[[tool.mypy.overrides]]
module = [
    ".agents.skills.gcp-pipeline-orchestration.scripts.trigger.airflow_trigger",
    ".agents.skills.gcs-security-assessment.scripts.cloud_rest_helpers_nodeps",
    ".agents.skills.gcs-security-assessment.scripts.evaluate_project_security_posture",
    ".agents.skills.gcs-security-assessment.scripts.fetch_bucket_telemetry",
    ".agents.skills.gcs-security-assessment.scripts.fetch_object_telemetry",
    "app.api.main",
    "app.benchmarks.bench_memory_ops",
    "app.examples.governance_demo.run",
    "app.examples.minimal_deployment.run",
    "app.examples.multi_agent_workflow.run",
    "app.kernel.memory_bus",
    "app.scripts.run_tests_shim",
    "scripts.environment_config",
    "services.mcp.artemis-kernel.src.artemis_kernel_mcp.server",
    "services.mcp.artemis-memory.src.artemis_memory_mcp.wiring",
    "services.mcp.artemis-validation.src.artemis_validation_mcp.wiring",
    "src.Experiments.legal_summarization.batch_runner",
    "src.Kernel.memory_bus",
    "src.agents.artemis.reflection",
    "src.agents.artemis_agent",
    "src.agents.atp.atp_validator",
    "src.agents.llm_agent",
