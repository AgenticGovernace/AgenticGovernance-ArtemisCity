[project]
name = "artemis-city"
version = "0.1.0"
description = "Architectural framework for agentic reasoning with transparent, accountable action across distributed intelligence systems"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [
    { name = "Prinston Palmer", email = "prinstonpalmer879@gmail.com" }
]
license = { text = "Apache License 2.0" }
keywords = ["agents", "ai", "agentic", "governance", "trust", "memory", "distributed-systems", "artificial-intelligence"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "alembic>=1.7.0",
    "autopep8>=1.5.0",
    "bandit>=1.7.0",
    "basedpyright>=1.39.6",
    "black>=26.5.1",
    "build>=1.0.0",
    "click>=8.1.0",
    "coverage>=7.0.0",
    "coverage-badge>=1.0.0",
    "datasets>=2.18.0",
    "django>=5.2.15",
    "docker>=7.1.0",
    "entrypoints>=0.4.0",
    "faker>=18.0.0",
    "fastapi>=0.109.1",
    "fastmcp>=3.4.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "httpx>=0.23.0",
    "ipdb>=0.13.13",
    "ipython>=8.18.0",
    "mcp>=1.26.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings-python==2.0.4",
    "mkdocstrings[python]>=0.24.0",
    "mypy>=1.5.0",
    "node>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pdbpp>=0.10.3",
    "pre-commit>=3.5.0",
    "prometheus-client>=0.14.0",
    "prompt-toolkit>=3.0.0",
    "psycopg2-binary>=2.9.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.4.0",
    "pylint>=3.0.0",
    "pyrefly>=0.60.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "pytest-cases>=3.7.0",
    "pytest-cov>=4.1.0",
    "pytest-factoryboy>=2.0.0",
    "pytest-fixture-config>=1.0.0",
    "pytest-html>=3.2.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.0.0",
    "python-dotenv>=1.2.2",
    "python-multipart==0.0.31",
    "pyyaml>=6.0.1,<7.0.0",
    "redis>=4.0.0",
    "requests>=2.33.0",
    "responses>=0.22.0",
    "rich>=13.7.0",
    "ruff==0.15.16",
    "safety>=2.3.0",
    "setuptools>=78.1.1",
    "sqlalchemy>=1.4.0",
    "twine>=3.0.0",
    "ty>=0.0.44",
    "types-pyyaml>=6.0.0",
    "uvicorn[standard]>=0.15.0",
    "vite>=1.5.2",
    "wheel>=0.38.1",
    "yapf>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "ipdb>=0.13.13",
    "ipython>=8.18.0",
    "pdbpp>=0.10.3",
    "pre-commit>=3.5.0",
]
test = [
    "coverage>=7.0.0",
    "coverage-badge>=1.0.0",
    "faker>=18.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.16.0",
    "pytest-cases>=3.7.0",
    "pytest-cov>=3.0.0",
    "pytest-factoryboy>=2.0.0",
    "pytest-fixture-config>=1.0.0",
    "pytest-html>=3.2.0",
    "pytest-mock>=3.7.0",
    "pytest-xdist>=3.0.0",
    "responses>=0.22.0",
]
lint = [
    "autopep8>=1.5.0",
    "bandit>=1.7.0",
    "flake8>=6.0.0",
    "flake8-docstrings>=1.7.0",
    "mypy>=1.5.0",
    "pylint>=3.0.0",
    "ruff>=0.15.15",
    "safety>=2.3.0",
    "types-pyyaml>=6.0.0",
    "yapf>=0.32.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mkdocstrings[python]>=0.24.0",
]
build = [
    "alembic>=1.7.0",
    "build>=1.0.0",
    "hatchling>=1.21.0",
    "twine>=3.0.0",
    "wheel>=0.38.1",
]
all = [
    "artemis-city[dev,test,lint,docs,build]",
]

[project.urls]
GitHub = "https://github.com/AgenticGovernace/AgenticGovernance-ArtemisCity.git"
Documentation = "https://artemiscity.mintlify.app/"
Website = "https://artemiscity.com/"
Demo = "https://artemiscity.com/demos"
